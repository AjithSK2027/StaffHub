<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#0A2218">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Staff Hub | Sleepy Stays</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #F1F5F9;
      padding: 1rem;
      padding-bottom: 5rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* Login card */
    .login-card {
      background: white;
      border-radius: 28px;
      padding: 2rem 1.5rem;
      max-width: 400px;
      margin: 2rem auto;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    .login-card h1 {
      font-size: 1.8rem;
      color: #0F3B2C;
      margin-bottom: 0.3rem;
    }

    .login-card p {
      color: #64748B;
      margin-bottom: 1.5rem;
    }

    /* Cards */
    .card {
      background: white;
      border-radius: 24px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      border: 1px solid #E2E8F0;
    }

    h2, h3 {
      color: #0F3B2C;
      margin-bottom: 0.8rem;
      font-weight: 600;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748B;
      text-transform: uppercase;
      margin-top: 0.8rem;
      margin-bottom: 0.2rem;
    }

    input, select, textarea {
      width: 100%;
      padding: 0.7rem;
      font-size: 1rem;
      border: 1.5px solid #CBD5E1;
      border-radius: 16px;
      background: white;
      margin-bottom: 0.5rem;
    }

    button {
      background: #0F3B2C;
      color: white;
      border: none;
      padding: 0.8rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      width: 100%;
      margin-top: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid #0F3B2C;
      color: #0F3B2C;
      margin-top: 0.4rem;
    }

    .toast {
      padding: 0.5rem;
      border-radius: 20px;
      margin-top: 0.8rem;
      text-align: center;
      font-size: 0.85rem;
      display: none;
    }

    .success {
      background: #E0F2E9;
      color: #0A5C3E;
    }

    .error {
      background: #FEE2E2;
      color: #B91C1C;
    }

    .badge {
      display: inline-block;
      background: #F0FDF4;
      padding: 0.2rem 0.7rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
      margin: 0.2rem;
    }

    /* Navigation */
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      background: white;
      padding: 0.5rem;
      border-radius: 60px;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .nav button {
      width: auto;
      padding: 0.5rem 1rem;
      background: #E2E8F0;
      color: #0F172A;
      margin-top: 0;
      flex: 1;
    }

    .nav button.active {
      background: #0F3B2C;
      color: white;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr 1fr;
      }
    }

    hr {
      margin: 1rem 0;
      border: none;
      border-top: 1px solid #E2E8F0;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      font-size: 0.8rem;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.5rem;
      text-align: left;
      border-bottom: 1px solid #E2E8F0;
    }

    th {
      color: #64748B;
      font-weight: 600;
    }

    .status-pill {
      display: inline-block;
      padding: 0.2rem 0.5rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .status-New { background: #EFF6FF; color: #2563EB; }
    .status-Contacted { background: #FFF7ED; color: #C2410C; }
    .status-Negotiation { background: #FEF9C3; color: #A16207; }
    .status-Won { background: #F0FDF4; color: #16A34A; }
    .status-Lost { background: #FEF2F2; color: #DC2626; }

    .empty {
      text-align: center;
      padding: 2rem;
      color: #64748B;
    }

    .profile-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .avatar {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #1E6B4A, #34C47A);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: white;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- LOGIN SECTION -->
  <div id="loginSection">
    <div class="login-card">
      <h1>🏨 Staff Hub</h1>
      <p>Sleepy Stays Operations</p>
      <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
      <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn">Sign in →</button>
      <div id="loginError" class="toast error" style="display:none;"></div>
    </div>
  </div>

  <!-- MAIN APP (hidden until login) -->
  <div id="appSection" style="display:none;">
    <div class="nav" id="navBar"></div>
    <div id="pageContent"></div>
  </div>
</div>

<script>
// ======================== CONFIGURATION ========================
const API_BASE = 'https://script.google.com/macros/s/AKfycby8qV5LS6ZFeHwwCKOPoOXU33EDgSL1oqdgkpD5UNbp9oNtuSH1iGspWdH-bCGB3xOApQ/exec';  // <-- REPLACE WITH YOUR WEB APP URL

// ======================== GLOBAL STATE ========================
let currentUser = null;        // stores user object after login
let currentPage = 'attendance';
let appData = {
  // Attendance
  selectedProperty: '',
  attendanceAction: 'CheckIn',
  attendanceDateTime: new Date().toISOString().slice(0,16),
  attendanceNotes: '',
  // EOD
  eodProperty: '',
  eodDate: new Date().toISOString().slice(0,10),
  eodSales: '',
  eodOccupancy: '',
  eodMaintenance: '',
  eodNotes: '',
  // Guest
  guestCheckIn: { name: '', property: '', datetime: '', room: '' },
  guestCheckOut: { name: '', property: '', datetime: '', amount: '', notes: '' },
  openCheckIns: [],
  // Helper
  helperName: '',
  helperProperty: '',
  helperDate: new Date().toISOString().slice(0,10),
  helperNotes: '',
  recentHelpers: [],
  // Leads
  lead: { name: '', contact: '', callsMade: 0, status: 'New', notes: '', property: '' },
  myLeads: [],
  allLeads: []
};

// ======================== HELPER FUNCTIONS ========================
function showToast(elementId, message, isSuccess) {
  const el = document.getElementById(elementId);
  if (el) {
    el.textContent = message;
    el.className = `toast ${isSuccess ? 'success' : 'error'}`;
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }
}

async function apiCall(action, params = {}) {
  const url = new URL(API_BASE);
  url.searchParams.append('action', action);
  Object.entries(params).forEach(([k, v]) => url.searchParams.append(k, v));
  const response = await fetch(url.toString());
  return response.json();
}

// ======================== DATA LOADING ========================
async function loadHelpers() {
  try {
    const data = await apiCall('getHelpers', { managerEmail: currentUser.email });
    if (data.success) appData.recentHelpers = data.data;
    else appData.recentHelpers = [];
  } catch(e) { appData.recentHelpers = []; }
}

async function loadOpenCheckIns() {
  try {
    const data = await apiCall('getOpenCheckIns', { property: appData.guestCheckOut.property || '' });
    if (data.success) appData.openCheckIns = data.data;
    else appData.openCheckIns = [];
  } catch(e) { appData.openCheckIns = []; }
}

async function loadMyLeads() {
  try {
    const data = await apiCall('getLeads', { staffEmail: currentUser.email, team: 'Sales' });
    if (data.success) appData.myLeads = data.data;
    else appData.myLeads = [];
  } catch(e) { appData.myLeads = []; }
}

async function loadAllLeads() {
  try {
    const data = await apiCall('getLeads', { staffEmail: currentUser.email, team: 'Management' });
    if (data.success) appData.allLeads = data.data;
    else appData.allLeads = [];
  } catch(e) { appData.allLeads = []; }
}

// ======================== PAGE RENDERING ========================
function renderAttendance() {
  return `
    <div class="card">
      <h2>📍 Attendance</h2>
      <label>Property</label>
      <select id="attProperty">${currentUser.assignedProperties.map(p => `<option ${appData.selectedProperty === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
      <label>Action</label>
      <select id="attAction"><option ${appData.attendanceAction === 'CheckIn' ? 'selected' : ''}>CheckIn</option><option ${appData.attendanceAction === 'CheckOut' ? 'selected' : ''}>CheckOut</option></select>
      <label>Date & time</label><input type="datetime-local" id="attDateTime" value="${appData.attendanceDateTime}">
      <label>Notes</label><textarea id="attNotes" rows="2">${appData.attendanceNotes}</textarea>
      <button id="submitAttendance">Record attendance</button>
      <div id="attMsg" class="toast"></div>
      <button id="shareAttendance" class="btn-outline">📱 Share on WhatsApp</button>
    </div>
  `;
}

function renderEOD() {
  return `
    <div class="card">
      <h2>📝 End of Day Report</h2>
      <div class="grid-2">
        <div>
          <label>Property</label><select id="eodProperty">${currentUser.assignedProperties.map(p => `<option ${appData.eodProperty === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
          <label>Report date</label><input type="date" id="eodDate" value="${appData.eodDate}">
          <label>Sales amount (₹)</label><input type="number" id="eodSales" value="${appData.eodSales}" placeholder="0">
          <label>Occupancy (%)</label><input type="text" id="eodOccupancy" value="${appData.eodOccupancy}" placeholder="85">
        </div>
        <div>
          <label>🛠️ Maintenance tasks</label><textarea id="eodMaintenance" rows="3">${appData.eodMaintenance}</textarea>
          <label>Additional notes</label><textarea id="eodNotes" rows="3">${appData.eodNotes}</textarea>
        </div>
      </div>
      <button id="submitEOD">Submit EOD</button>
      <div id="eodMsg" class="toast"></div>
      <button id="shareEOD" class="btn-outline">📱 Share on WhatsApp</button>
    </div>
  `;
}

function renderGuests() {
  return `
    <div class="grid-2">
      <div class="card">
        <h3>➕ Check In</h3>
        <label>Guest name</label><input type="text" id="guestInName" placeholder="Full name" value="${appData.guestCheckIn.name}">
        <label>Property</label><select id="guestInProperty">${currentUser.assignedProperties.map(p => `<option ${appData.guestCheckIn.property === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
        <label>Check‑in date & time</label><input type="datetime-local" id="guestInDateTime" value="${appData.guestCheckIn.datetime}">
        <label>Room / Unit</label><input type="text" id="guestInRoom" placeholder="e.g. 101" value="${appData.guestCheckIn.room}">
        <button id="doGuestCheckIn">Check in guest</button>
      </div>
      <div class="card">
        <h3>➖ Check Out</h3>
        <label>Guest name</label><input type="text" id="guestOutName" placeholder="Start typing" value="${appData.guestCheckOut.name}" list="openGuestsList">
        <datalist id="openGuestsList">${appData.openCheckIns.map(g => `<option value="${g.GuestName}"></option>`).join('')}</datalist>
        <label>Property</label><select id="guestOutProperty">${currentUser.assignedProperties.map(p => `<option ${appData.guestCheckOut.property === p ? 'selected' : ''}>${p}</option>`).join('')}</select>
        <label>Check‑out date & time</label><input type="datetime-local" id="guestOutDateTime" value="${appData.guestCheckOut.datetime}">
        <label>Amount paid (₹)</label><input type="number" id="guestOutAmount" value="${appData.guestCheckOut.amount}" placeholder="0">
        <label>Notes</label><textarea id="guestOutNotes" rows="2">${appData.guestCheckOut.notes}</textarea>
        <button id="doGuestCheckOut">Check out & record payment</button>
      </div>
    </div>
    <div id="guestMsg" class="toast"></div>
  `;
}

function renderHelpers() {
  return `
    <div class="card">
      <h2>🧑‍🌾 Log a Helper</h2>
      <div class="grid-2">
        <div><label>Helper name</label><input type="text" id="helperName" value="${appData.helperName}"><label>Property</label><select id="helperProperty">${currentUser.assignedProperties.map(p => `<option ${appData.helperProperty === p ? 'selected' : ''}>${p}</option>`).join('')}</select></div>
        <div><label>Work date</label><input type="date" id="helperDate" value="${appData.helperDate}"><label>Notes</label><textarea id="helperNotes" rows="2">${appData.helperNotes}</textarea></div>
      </div>
      <button id="addHelper">Log helper</button>
      <div id="helperMsg" class="toast"></div>
    </div>
    <div class="card">
      <h3>📋 Recent Helpers</h3>
      <div class="table-wrap">${appData.recentHelpers.length ? `<table><thead><tr><th>Date</th><th>Name</th><th>Property</th><th>Notes</th></tr></thead><tbody>${appData.recentHelpers.slice(0,8).map(h => `<tr><td>${h.WorkDate}</td><td>${h.HelperName}</td><td>${h.Property}</td><td>${h.Notes}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No helpers logged</div>'}</div>
    </div>
  `;
}

function renderLeads() {
  const displayLeads = currentUser.team === 'Sales' ? appData.myLeads : appData.allLeads;
  return `
    <div class="card">
      <h2>📞 Add Lead</h2>
      <div class="grid-2">
        <div><label>Lead name *</label><input type="text" id="leadName" value="${appData.lead.name}"><label>Property *</label><select id="leadProperty">${currentUser.assignedProperties.map(p => `<option ${appData.lead.property === p ? 'selected' : ''}>${p}</option>`).join('')}</select><label>Contact</label><input type="text" id="leadContact" value="${appData.lead.contact}"></div>
        <div><label>Calls made</label><input type="number" id="leadCalls" value="${appData.lead.callsMade}" min="0"><label>Status</label><select id="leadStatus"><option ${appData.lead.status === 'New' ? 'selected' : ''}>New</option><option ${appData.lead.status === 'Contacted' ? 'selected' : ''}>Contacted</option><option ${appData.lead.status === 'Negotiation' ? 'selected' : ''}>Negotiation</option><option ${appData.lead.status === 'Won' ? 'selected' : ''}>Won</option><option ${appData.lead.status === 'Lost' ? 'selected' : ''}>Lost</option></select><label>Notes</label><textarea id="leadNotes" rows="2">${appData.lead.notes}</textarea></div>
      </div>
      <button id="addLead">Add lead</button>
      <div id="leadMsg" class="toast"></div>
      <button id="shareLead" class="btn-outline">📱 Share on WhatsApp</button>
    </div>
    <div class="card">
      <h3>${currentUser.team === 'Sales' ? 'My Recent Leads' : 'All Sales Leads'}</h3>
      <div class="table-wrap">${displayLeads.length ? `<table><thead><tr>${currentUser.team !== 'Sales' ? '<th>Staff</th>' : ''}<th>Date</th><th>Lead</th><th>Property</th><th>Calls</th><th>Status</th><th>Notes</th></tr></thead><tbody>${displayLeads.slice(0,15).map(l => `<tr>${currentUser.team !== 'Sales' ? `<td>${l.StaffEmail?.split('@')[0]}</td>` : ''}<td>${l.Timestamp?.slice(0,10)}</td><td>${l.LeadName}</td><td>${l.Property}</td><td>${l.CallsMade}</td><td><span class="status-pill status-${l.Status}">${l.Status}</span></td><td>${l.Notes}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No leads found</div>'}</div>
    </div>
  `;
}

function renderProfile() {
  return `
    <div class="card">
      <div class="profile-row"><div class="avatar">${currentUser.name ? currentUser.name[0].toUpperCase() : '?'}</div><div><h3 style="margin:0">${currentUser.name}</h3><div>${currentUser.team} · ${currentUser.role}</div></div></div>
      <hr><div><strong>📞 Phone:</strong> ${currentUser.phone || '—'}</div>
      <div><strong>👥 Team:</strong> ${currentUser.team}</div>
      <div><strong>🏷️ Role:</strong> ${currentUser.role}</div>
      <hr><div style="font-weight:600; margin-bottom:0.5rem;">Assigned Properties</div>
      <div>${currentUser.assignedProperties.map(p => `<span class="badge">🏠 ${p}</span>`).join('')}</div>
    </div>
  `;
}

// ======================== EVENT ATTACHMENT ========================
function attachPageEvents() {
  if (currentPage === 'attendance') {
    document.getElementById('submitAttendance')?.addEventListener('click', submitAttendance);
    document.getElementById('shareAttendance')?.addEventListener('click', shareAttendanceWhatsApp);
    document.getElementById('attProperty')?.addEventListener('change', (e) => appData.selectedProperty = e.target.value);
    document.getElementById('attAction')?.addEventListener('change', (e) => appData.attendanceAction = e.target.value);
    document.getElementById('attDateTime')?.addEventListener('change', (e) => appData.attendanceDateTime = e.target.value);
    document.getElementById('attNotes')?.addEventListener('input', (e) => appData.attendanceNotes = e.target.value);
  } else if (currentPage === 'eod') {
    document.getElementById('submitEOD')?.addEventListener('click', submitEOD);
    document.getElementById('shareEOD')?.addEventListener('click', shareEODWhatsApp);
    document.getElementById('eodProperty')?.addEventListener('change', (e) => appData.eodProperty = e.target.value);
    document.getElementById('eodDate')?.addEventListener('change', (e) => appData.eodDate = e.target.value);
    document.getElementById('eodSales')?.addEventListener('input', (e) => appData.eodSales = e.target.value);
    document.getElementById('eodOccupancy')?.addEventListener('input', (e) => appData.eodOccupancy = e.target.value);
    document.getElementById('eodMaintenance')?.addEventListener('input', (e) => appData.eodMaintenance = e.target.value);
    document.getElementById('eodNotes')?.addEventListener('input', (e) => appData.eodNotes = e.target.value);
  } else if (currentPage === 'guests') {
    document.getElementById('doGuestCheckIn')?.addEventListener('click', doGuestCheckIn);
    document.getElementById('doGuestCheckOut')?.addEventListener('click', doGuestCheckOut);
    document.getElementById('guestInName')?.addEventListener('input', (e) => appData.guestCheckIn.name = e.target.value);
    document.getElementById('guestInProperty')?.addEventListener('change', (e) => appData.guestCheckIn.property = e.target.value);
    document.getElementById('guestInDateTime')?.addEventListener('change', (e) => appData.guestCheckIn.datetime = e.target.value);
    document.getElementById('guestInRoom')?.addEventListener('input', (e) => appData.guestCheckIn.room = e.target.value);
    document.getElementById('guestOutName')?.addEventListener('input', (e) => appData.guestCheckOut.name = e.target.value);
    document.getElementById('guestOutProperty')?.addEventListener('change', (e) => appData.guestCheckOut.property = e.target.value);
    document.getElementById('guestOutDateTime')?.addEventListener('change', (e) => appData.guestCheckOut.datetime = e.target.value);
    document.getElementById('guestOutAmount')?.addEventListener('input', (e) => appData.guestCheckOut.amount = e.target.value);
    document.getElementById('guestOutNotes')?.addEventListener('input', (e) => appData.guestCheckOut.notes = e.target.value);
  } else if (currentPage === 'helpers') {
    document.getElementById('addHelper')?.addEventListener('click', addHelper);
    document.getElementById('helperName')?.addEventListener('input', (e) => appData.helperName = e.target.value);
    document.getElementById('helperProperty')?.addEventListener('change', (e) => appData.helperProperty = e.target.value);
    document.getElementById('helperDate')?.addEventListener('change', (e) => appData.helperDate = e.target.value);
    document.getElementById('helperNotes')?.addEventListener('input', (e) => appData.helperNotes = e.target.value);
  } else if (currentPage === 'leads') {
    document.getElementById('addLead')?.addEventListener('click', addLead);
    document.getElementById('shareLead')?.addEventListener('click', shareLeadWhatsApp);
    document.getElementById('leadName')?.addEventListener('input', (e) => appData.lead.name = e.target.value);
    document.getElementById('leadProperty')?.addEventListener('change', (e) => appData.lead.property = e.target.value);
    document.getElementById('leadContact')?.addEventListener('input', (e) => appData.lead.contact = e.target.value);
    document.getElementById('leadCalls')?.addEventListener('input', (e) => appData.lead.callsMade = parseInt(e.target.value) || 0);
    document.getElementById('leadStatus')?.addEventListener('change', (e) => appData.lead.status = e.target.value);
    document.getElementById('leadNotes')?.addEventListener('input', (e) => appData.lead.notes = e.target.value);
  }
}

// ======================== PAGE RENDERING & NAVIGATION ========================
function renderCurrentPage() {
  const container = document.getElementById('pageContent');
  switch (currentPage) {
    case 'attendance': container.innerHTML = renderAttendance(); break;
    case 'eod': container.innerHTML = renderEOD(); break;
    case 'guests': container.innerHTML = renderGuests(); break;
    case 'helpers': container.innerHTML = renderHelpers(); break;
    case 'leads': container.innerHTML = renderLeads(); break;
    case 'profile': container.innerHTML = renderProfile(); break;
    default: container.innerHTML = '<div class="card">Page not found</div>';
  }
  attachPageEvents();
}

function buildNavBar() {
  const pages = ['attendance', 'eod', 'guests', 'helpers', 'leads', 'profile'];
  const labels = { attendance:'📍 Attend', eod:'📝 EOD', guests:'🧑‍🤝‍🧑 Guests', helpers:'🧑‍🌾 Helpers', leads:'📞 Leads', profile:'👤 Profile' };
  const navDiv = document.getElementById('navBar');
  navDiv.innerHTML = pages.map(p => `<button class="${currentPage === p ? 'active' : ''}" data-page="${p}">${labels[p]}</button>`).join('');
  navDiv.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      currentPage = btn.dataset.page;
      renderCurrentPage();
      buildNavBar(); // re-render nav to update active class
    });
  });
}

// ======================== API ACTIONS ========================
async function submitAttendance() {
  const property = document.getElementById('attProperty')?.value || appData.selectedProperty;
  const action = document.getElementById('attAction')?.value || appData.attendanceAction;
  const datetime = document.getElementById('attDateTime')?.value || appData.attendanceDateTime;
  const notes = document.getElementById('attNotes')?.value || appData.attendanceNotes;
  if (!property || !datetime) { showToast('attMsg', 'Property and datetime required', false); return; }
  try {
    const data = await apiCall('checkInOut', { email: currentUser.email, property, action, datetime, notes });
    if (data.success) {
      showToast('attMsg', `✅ ${action} recorded`, true);
      if (data.whatsappLink) window.open(data.whatsappLink, '_blank');

// ======================== LOGIN & PERSISTENCE ========================
async function login(email, password) {
  try {
    const data = await apiCall('login', { email, password });
    if (data.success) {
      currentUser = data;
      currentUser.email = email; // ensure email field
      // Save to localStorage
      localStorage.setItem('staffHubUser', JSON.stringify(currentUser));
      // Hide login, show app
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('appSection').style.display = 'block';
      // Initialize app data defaults
      if (currentUser.assignedProperties.length) {
        appData.selectedProperty = currentUser.assignedProperties[0];
        appData.eodProperty = currentUser.assignedProperties[0];
        appData.helperProperty = currentUser.assignedProperties[0];
        appData.guestCheckIn.property = currentUser.assignedProperties[0];
        appData.guestCheckOut.property = currentUser.assignedProperties[0];
        appData.lead.property = currentUser.assignedProperties[0];
      }
      // Load data
      await loadHelpers();
      await loadOpenCheckIns();
      if (currentUser.team === 'Sales') await loadMyLeads();
      else await loadAllLeads();
      // Render UI
      buildNavBar();
      renderCurrentPage();
    } else {
      const errorDiv = document.getElementById('loginError');
      errorDiv.textContent = data.error || 'Login failed';
      errorDiv.style.display = 'block';
    }
  } catch(e) {
    const errorDiv = document.getElementById('loginError');
    errorDiv.textContent = 'Network error. Check API URL.';
    errorDiv.style.display = 'block';
  }
}

document.getElementById('loginBtn').addEventListener('click', () => {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd = document.getElementById('loginPassword').value;
  if (!email || !pwd) {
    const errorDiv = document.getElementById('loginError');
    errorDiv.textContent = 'Email and password required';
    errorDiv.style.display = 'block';
    return;
  }
  login(email, pwd);
});

// Auto-login from localStorage
window.addEventListener('DOMContentLoaded', () => {
  const savedUser = localStorage.getItem('staffHubUser');
  if (savedUser) {
    try {
      const user = JSON.parse(savedUser);
      // We still need to verify the session? Optionally we can attempt a login again or trust it.
      // For simplicity, we'll try to login again with stored email/password? But we don't have password in storage.
      // Better to require re-login for security. But the user wanted persistent login.
      // We'll store the user object and assume it's valid for the session.
      // However, we need to reload all data. We'll call a quick check using getEmployeeData if needed.
      // To avoid extra complexity, we'll just set currentUser and load data.
      currentUser = user;
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('appSection').style.display = 'block';
      if (currentUser.assignedProperties.length) {
        appData.selectedProperty = currentUser.assignedProperties[0];
        appData.eodProperty = currentUser.assignedProperties[0];
        appData.helperProperty = currentUser.assignedProperties[0];
        appData.guestCheckIn.property = currentUser.assignedProperties[0];
        appData.guestCheckOut.property = currentUser.assignedProperties[0];
        appData.lead.property = currentUser.assignedProperties[0];
      }
      loadHelpers();
      loadOpenCheckIns();
      if (currentUser.team === 'Sales') loadMyLeads();
      else loadAllLeads();
      buildNavBar();
      renderCurrentPage();
    } catch(e) { console.warn('Failed to restore session', e); }
  }
});
